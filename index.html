<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Block World Survival</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <!-- Crosshair -->
    <div id="crosshair">+</div>

    <!-- Top HUD -->
    <div id="hud">

        <div id="gameTitle">
            BLOCK WORLD
        </div>

        <div id="stats">
            ❤️ <span id="health">100</span>
            &nbsp;&nbsp;
            🍗 <span id="hunger">100</span>
        </div>

    </div>


    <!-- Messages -->
    <div id="message"></div>


    <!-- PC Controls -->
    <div id="pcHelp">

        <b>BLOCK WORLD</b>

        <br><br>

        WASD = Move<br>
        Mouse = Look<br>
        Space = Jump<br>
        Left Click = Mine<br>
        Right Click = Place<br>
        E = Inventory<br>
        C = Crafting<br>
        1-9 = Hotbar

    </div>


    <!-- Inventory -->
    <div id="inventory" class="panel">

        <div class="panelHeader">

            <span>🎒 INVENTORY</span>

            <button id="closeInventory">
                ✕
            </button>

        </div>

        <div id="inventoryItems"></div>

    </div>


    <!-- Crafting -->
    <div id="crafting" class="panel">

        <div class="panelHeader">

            <span>🔨 CRAFTING</span>

            <button id="closeCrafting">
                ✕
            </button>

        </div>

        <div class="craftGrid">

            <button class="craft-btn"
                    data-recipe="planks">
                🪵 Wood → 4 Planks
            </button>

            <button class="craft-btn"
                    data-recipe="sticks">
                🪵 2 Planks → 4 Sticks
            </button>

            <button class="craft-btn"
                    data-recipe="craftingTable">
                🧱 4 Planks → Crafting Table
            </button>

            <button class="craft-btn"
                    data-recipe="woodPickaxe">
                ⛏️ Wooden Pickaxe
            </button>

            <button class="craft-btn"
                    data-recipe="stonePickaxe">
                ⛏️ Stone Pickaxe
            </button>

        </div>

        <div id="craftMessage"></div>

    </div>


    <!-- Hotbar -->
    <div id="hotbar">

        <div class="slot selected"
             data-block="grass"
             data-key="1">

            <span class="icon">🌱</span>
            <span class="count" id="count-grass">0</span>

        </div>


        <div class="slot"
             data-block="dirt"
             data-key="2">

            <span class="icon">🟫</span>
            <span class="count" id="count-dirt">0</span>

        </div>


        <div class="slot"
             data-block="stone"
             data-key="3">

            <span class="icon">⬜</span>
            <span class="count" id="count-stone">0</span>

        </div>


        <div class="slot"
             data-block="wood"
             data-key="4">

            <span class="icon">🪵</span>
            <span class="count" id="count-wood">0</span>

        </div>


        <div class="slot"
             data-block="leaves"
             data-key="5">

            <span class="icon">🌿</span>
            <span class="count" id="count-leaves">0</span>

        </div>


        <div class="slot"
             data-block="coal"
             data-key="6">

            <span class="icon">⚫</span>
            <span class="count" id="count-coal">0</span>

        </div>


        <div class="slot"
             data-block="craftingTable"
             data-key="7">

            <span class="icon">🧱</span>
            <span class="count" id="count-craftingTable">0</span>

        </div>


    </div>


    <!-- Mobile Controls -->

    <div id="mobileControls">

        <!-- Joystick -->
        <div id="joystick">

            <div id="joystickKnob"></div>

        </div>


        <!-- Look Area -->
        <div id="lookArea"></div>


        <!-- Buttons -->

        <button id="jumpBtn"
                class="mobileBtn">
            ⬆
        </button>


        <button id="mineBtn"
                class="mobileBtn">
            ⛏
        </button>


        <button id="placeBtn"
                class="mobileBtn">
            🧱
        </button>


        <button id="inventoryBtn"
                class="mobileBtn">
            🎒
        </button>


        <button id="craftBtn"
                class="mobileBtn">
            🔨
        </button>

    </div>


    <!-- Landscape message -->
    <div id="rotateScreen">

        <div>
            📱
            <br><br>
            Please rotate your phone
            <br>
            to landscape mode
        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
